server {
    listen 80;
    server_name acceptatie.viewer.razu.nl;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name acceptatie.viewer.razu.nl;

    ssl_certificate /etc/letsencrypt/live/acceptatie.viewer.razu.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acceptatie.viewer.razu.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Valeros
    location / {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd_valeros;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # gotenberg-proxy
    location /gotenberg/convert {
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
        proxy_pass http://127.0.0.1:5000/convert;
    }

    # sura
    location /sura/process-url {
        proxy_pass http://127.0.0.1:8001/process-url;
    }

    location /sura/_search {
        # CORS headers have been moved to the SURA container
        # add_header 'Access-Control-Allow-Origin' '*';
        # add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS';
        proxy_pass http://127.0.0.1:8001/_search;
    }

    # snippetserver
    location = /snippet {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers have been moved to the snippetserver container
        # add_header Access-Control-Allow-Origin *;
        # add_header Access-Control-Allow-Headers Content-Type;
        # if ($request_method = OPTIONS) {
        #     return 204;
        # }
    }
}