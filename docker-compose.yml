services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: development # production
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - gotenberg-proxy

  gotenberg-proxy:
    build:
      context: https://github.com/Simon-Dirks/gotenberg-proxy.git
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      GOTENBERG_HOST: http://gotenberg:3000
    depends_on:
      - gotenberg

  gotenberg:
    image: gotenberg/gotenberg:8
    environment:
      - CHROMIUM_DISABLE_ROUTES=1

  sura:
    build:
      context: https://github.com/Regionaal-Archief-Zuid-Utrecht/SURA.git
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./docker/sura/general.env:/app/general.env
      - ./docker/sura/jwt.env:/app/jwt.env

  snippetserver:
    build:
      context: https://github.com/Regionaal-Archief-Zuid-Utrecht/snippetserver.git
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      ALLOWED_HOSTS: opslag.razu.nl

  matomo-db:
    image: mariadb:lts
    command: --max-allowed-packet=64MB
    env_file:
      - ./docker/matomo/db.env
    environment:
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DATABASE=matomo
      - MARIADB_DISABLE_UPGRADE_BACKUP=1
      - MARIADB_INITDB_SKIP_TZINFO=1
      - MARIADB_USER=matomo
    volumes:
      - matomo-db:/var/lib/mysql

  matomo:
    image: matomo:fpm-alpine
    depends_on:
      - matomo-db
    env_file:
      - ./docker/matomo/db.env
    environment:
      - MATOMO_DATABASE_ADAPTER=mysql
      - MATOMO_DATABASE_DBNAME=matomo
      - MATOMO_DATABASE_HOST=matomo-db
      - MATOMO_DATABASE_TABLES_PREFIX=matomo_
      - MATOMO_DATABASE_USERNAME=matomo
    volumes:
      - matomo:/var/www/html

  matomo-web:
    image: nginx:alpine
    depends_on:
      - matomo
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - matomo:/var/www/html:ro
      - ./docker/matomo/matomo.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  matomo-db:
  matomo:
